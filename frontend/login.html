<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FX Bot — Sign in</title>
  <meta name="description" content="Sign in to your FX Bot trading dashboard." />

  <!--
    ============================================================
    SHIPPING NOTE FOR BACKEND TEAM — see frontend/docs/INTEGRATION.md
    ============================================================
    Submits POST {API_BASE_URL}/auth/sign-in with { email, password }.
    Backend route: backend/src/routes/auth.routes.js (already wired,
    but backend/src/services/auth.service.js returns 501 until
    DATABASE_URL + a real user lookup exist).

    This page also honours a ?redirect= query param the same way the
    Markets page's price rows already generate it
    (login.html?redirect=%2Ftrade%2FBTC-USD) — see js/auth-forms.js's
    TODO for where the post-login redirect actually happens once
    session handling exists.
    ============================================================
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">

  <!-- Must load before other scripts — see js/config.js -->
  <script src="js/config.js"></script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <a href="/" class="auth-back" data-action="nav:back" aria-label="Go back">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <main id="main" class="auth-shell">
    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-brand__row">
          <span class="brand__mark" aria-hidden="true" data-brand-mark>FX</span>
          <span class="auth-brand__text">
            <span class="auth-brand__name" data-brand-name>FX Bot</span>
            <span class="auth-brand__est" data-brand-est>Est. 2023</span>
          </span>
        </div>
      </div>

      <div class="auth-badge">
        <span class="badge">
          <svg class="badge__icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2 4 4.5v4c0 4 2.5 7 6 8.5 3.5-1.5 6-4.5 6-8.5v-4L10 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          Client Portal
        </span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to access your trading dashboard.</p>

      <form class="auth-form" data-form="login" novalidate>

        <div class="field">
          <label class="field__label" for="loginEmail">Email Address<span class="field__required" aria-hidden="true">*</span></label>
          <div class="field__control">
            <span class="field__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="1.6" stroke="currentColor" stroke-width="1.6"/><path d="m4.5 7 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <input class="field__input" type="email" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="email" required aria-required="true" />
          </div>
          <p class="field-error" role="alert"></p>
        </div>

        <div class="field">
          <div class="check-row--between">
            <label class="field__label" for="loginPassword">Password<span class="field__required" aria-hidden="true">*</span></label>
            <a href="/forgot-password" class="field-link">Forgot?</a>
          </div>
          <div class="field__control">
            <span class="field__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9" rx="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <input class="field__input" type="password" id="loginPassword" name="password" placeholder="Your password" autocomplete="current-password" required aria-required="true" />
            <button type="button" class="field__toggle" data-toggle-password="loginPassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
          <p class="field-error" role="alert"></p>
        </div>

        <div class="check-row">
          <input type="checkbox" id="keepSignedIn" name="rememberMe" checked />
          <label class="check-row__text" for="keepSignedIn">Keep me signed in on this device</label>
        </div>

        <button type="submit" class="btn btn--primary btn--lg">Sign in to my account</button>
        <p class="form-status" data-form-status role="status"></p>
      </form>

      <div class="auth-trust">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2 4 4.5v4c0 4 2.5 7 6 8.5 3.5-1.5 6-4.5 6-8.5v-4L10 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m7.5 10 1.8 1.8L13 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>256-bit TLS</span><span aria-hidden="true">·</span><span>Encrypted session</span>
      </div>

      <p class="auth-switch">Don't have an account? <a href="register.html">Create account</a></p>
    </div>
  </main>

  <script src="js/main.js" defer></script>
  <script src="js/auth-forms.js" defer></script>
</body>
</html>
