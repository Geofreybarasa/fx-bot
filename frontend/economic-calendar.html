<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Economic Calendar — FX Bot</title>
  <meta name="description" content="High-impact macro events used by the AI Scalping Bot to gate exposure on Gold and FX pairs." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/economic-calendar.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">

  <script src="js/config.js"></script>
</head>
<body class="ec-page">

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="ec-header">
    <a href="/" class="ec-back" data-action="nav:back" aria-label="Back to home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 class="ec-header__title">Economic Calendar</h1>
  </header>

  <!--
    data-endpoint: YOUR backend route that proxies the ForexFactory feeds
    (this week + next week) and returns one JSON array. See the comment
    at the top of js/economic-calendar.js for the exact shape.
  -->
  <main id="main" class="ec-main" data-endpoint="/api/economic-calendar">

    <div class="ec-status" role="status">
      <span class="ec-status__pill" id="ecPill"><span class="ec-status__dot" aria-hidden="true"></span><span id="ecPillText">LIVE</span></span>
      <span class="ec-status__text">ForexFactory feed · this week + next week</span>
    </div>

    <p class="ec-lede">High-impact macro events used by the AI Scalping Bot to gate exposure on Gold and FX pairs.</p>

    <div class="ec-filters" role="group" aria-label="Filter events">
      <button type="button" class="ec-chip is-active" data-filter="all" aria-pressed="true">All events</button>
      <button type="button" class="ec-chip" data-filter="high" aria-pressed="false">High impact only</button>
    </div>

    <section class="ec-card" id="ecCard" aria-live="polite" aria-busy="true">
      <svg class="ec-card__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M4 9.5h16M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div id="ecBody">
        <p class="ec-empty">Loading events…</p>
      </div>
    </section>

    <p class="ec-foot">Times shown in your local timezone · Source: ForexFactory</p>
  </main>

  <nav class="app-nav" aria-label="Primary">
    <a href="/" class="app-nav__item" data-action="nav:home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5h12V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </a>
    <a href="markets.html" class="app-nav__item" data-action="nav:markets">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19V10M12 19V5M19 19v-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Markets</span>
    </a>
    <a href="login.html" class="app-nav__item" data-action="nav:trade">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h13M17 7l-3-3M17 7l-3 3M20 17H7M7 17l3 3M7 17l3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Trade</span>
    </a>
    <a href="promotions.html" class="app-nav__item" data-action="nav:earn">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="12" r="5" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="12" r="5" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Earn</span>
    </a>
    <a href="login.html" class="app-nav__item" data-action="nav:funds">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="1.8" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 10h17" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Funds</span>
    </a>
  </nav>

  <script src="js/economic-calendar.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
